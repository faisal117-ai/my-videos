    <div id="c11-lab" class="c11-label clip" data-start="0.3" data-duration="4.6"><b>باب 11</b><i>معزز مہمان</i></div>
    <div id="c11-cp0" class="c11-cap clip" data-start="0.22" data-duration="2.40">ابراہیم اب بوڑھے ہو چکے تھے۔</div>
    <div id="c11-cp1" class="c11-cap clip" data-start="2.62" data-duration="3.24">اور ان کی بیوی، سارہ، کے ہاں کبھی اولاد نہیں ہوئی تھی۔</div>
    <div id="c11-cp2" class="c11-cap clip" data-start="20.49" data-duration="2.37">بغیر کچھ کہے، وہ اپنے گھر والوں کے پاس</div>
    <div id="c11-cp3" class="c11-cap clip" data-start="22.86" data-duration="3.91">گئے، اور ایک موٹا تازہ بھنا ہوا بچھڑا لے آئے۔</div>
    <div id="c11-cp4" class="c11-cap clip" data-start="40.14" data-duration="1.43">اور انہیں خوشخبری دی۔</div>
    <div id="c11-cp5" class="c11-cap clip" data-start="71.74" data-duration="6.67">اسحاق کی نسل سے یعقوب، یوسف، موسیٰ، داؤد، سلیمان اور عیسیٰ۔</div>
    <div id="c11-cp6" class="c11-cap clip" data-start="78.41" data-duration="1.49">انبیاء کا باپ۔</div>
    <div id="c11-k0w" class="c11-cardwrap clip" data-start="5.91" data-duration="12.11"><div id="c11-k0" class="c11-card"><div class="c11-ar" dir="rtl" lang="ar">هَلۡ أَتَىٰكَ حَدِيثُ ضَيۡفِ إِبۡرَٰهِيمَ ٱلۡمُكۡرَمِينَ</div><div class="c11-en c11-urtr" dir="rtl" lang="ur">ابراہیمؑ کے معزز مہمانوں کی حکایت بھی تمہیں پہنچی ہے</div><div class="c11-ref">Adh-Dhariyat 51:24</div></div></div>
    <div id="c11-k1w" class="c11-cardwrap clip" data-start="26.82" data-duration="10.04"><div id="c11-k1" class="c11-card"><div class="c11-ar" dir="rtl" lang="ar">قَالَ أَلَا تَأۡكُلُونَ</div><div class="c11-en c11-urtr" dir="rtl" lang="ur">آپ حضرات کھاتے نہیں</div><div class="c11-ref">Adh-Dhariyat 51:27</div></div></div>
    <div id="c11-k2w" class="c11-cardwrap clip" data-start="41.62" data-duration="8.53"><div id="c11-k2" class="c11-card"><div class="c11-ar" dir="rtl" lang="ar">فَبَشَّرۡنَٰهَا بِإِسۡحَٰقَ وَمِن وَرَآءِ إِسۡحَٰقَ يَعۡقُوبَ</div><div class="c11-en c11-urtr" dir="rtl" lang="ur">پھر ہم نے اس کو اسحاقؑ کی اور اسحاقؑ کے بعد یعقوب کی خوشخبری دی</div><div class="c11-ref">Hud 11:71</div></div></div>
