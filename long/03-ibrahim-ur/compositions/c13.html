    <div id="c13-lab" class="c13-label clip" data-start="0.3" data-duration="4.6"><b>باب 13</b><i>ابراہیمؑ کی دعا</i></div>
    <div id="c13-cp0" class="c13-cap clip" data-start="0.22" data-duration="4.88">بڑھاپے میں، ابراہیم اسی وادی میں کھڑے تھے جو کبھی ویران تھی،</div>
    <div id="c13-cp1" class="c13-cap clip" data-start="5.10" data-duration="4.50">اور انہوں نے ایک ایسی دعا کی جو مسلمان آج بھی پڑھتے ہیں۔</div>
    <div id="c13-cp2" class="c13-cap clip" data-start="19.61" data-duration="4.37">اس بڑھاپے میں اسماعیل اور اسحاق جیسے بیٹے دیے۔</div>
    <div id="c13-cp3" class="c13-cap clip" data-start="23.98" data-duration="3.54">حقیقت یہ ہے کہ میرا رب ضرور دعا سنتا ہے۔</div>
    <div id="c13-cp4" class="c13-cap clip" data-start="47.02" data-duration="3.02">ہر نماز میں، سلام سے پہلے پڑھتے ہیں۔</div>
    <div id="c13-cp5" class="c13-cap clip" data-start="50.04" data-duration="4.98">ابراہیم کے الفاظ، ہزاروں سال بعد بھی، ہماری زبانوں پر۔</div>
    <div id="c13-k0w" class="c13-cardwrap clip" data-start="9.65" data-duration="8.86"><div id="c13-k0" class="c13-card"><div class="c13-ar" dir="rtl" lang="ar">رَبِّ ٱجۡعَلۡ هَٰذَا ٱلۡبَلَدَ ءَامِنࣰا وَٱجۡنُبۡنِي وَبَنِيَّ أَن نَّعۡبُدَ ٱلۡأَصۡنَامَ</div><div class="c13-en c13-urtr" dir="rtl" lang="ur">پروردگار، اِس شہر کو امن کا شہر بنا اور مجھے اور میری اولاد کو بت پرستی سے بچا</div><div class="c13-ref">Ibrahim 14:35</div></div></div>
    <div id="c13-k1w" class="c13-cardwrap clip" data-start="27.57" data-duration="8.67"><div id="c13-k1" class="c13-card"><div class="c13-ar" dir="rtl" lang="ar">رَبِّ ٱجۡعَلۡنِي مُقِيمَ ٱلصَّلَوٰةِ وَمِن ذُرِّيَّتِيۚ رَبَّنَا وَتَقَبَّلۡ دُعَآءِ</div><div class="c13-en c13-urtr" dir="rtl" lang="ur">مجھے نماز قائم کرنے والا بنا اور میری اولاد سے بھی (ایسے لوگ اٹھا جو یہ کام کریں) پروردگار، میری دعا قبول کر</div><div class="c13-ref">Ibrahim 14:40</div></div></div>
    <div id="c13-k2w" class="c13-cardwrap clip" data-start="36.34" data-duration="9.88"><div id="c13-k2" class="c13-card"><div class="c13-ar" dir="rtl" lang="ar">رَبَّنَا ٱغۡفِرۡ لِي وَلِوَٰلِدَيَّ وَلِلۡمُؤۡمِنِينَ يَوۡمَ يَقُومُ ٱلۡحِسَابُ</div><div class="c13-en c13-urtr" dir="rtl" lang="ur">پروردگار، مجھے اور میرے والدین کو اور سب ایمان لانے والوں کو اُس دن معاف کر دیجیو جبکہ حساب قائم ہوگا</div><div class="c13-ref">Ibrahim 14:41</div></div></div>
