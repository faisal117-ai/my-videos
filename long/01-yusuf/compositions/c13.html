    <div id="c13-lab" class="c13-label clip" data-start="0.3" data-duration="4.6"><b>CHAPTER 13</b><i>The Lesson</i></div>
    <div id="c13-cp0" class="c13-cap clip" data-start="0.22" data-duration="2.39">A well. A slave market.</div>
    <div id="c13-cp1" class="c13-cap clip" data-start="2.61" data-duration="2.48">A locked door. A prison.</div>
    <div id="c13-cp2" class="c13-cap clip" data-start="5.10" data-duration="1.74">Years of waiting.</div>
    <div id="c13-cp3" class="c13-cap clip" data-start="6.84" data-duration="3.14">Every one of them was a step towards the throne.</div>
    <div id="c13-cp4" class="c13-cap clip" data-start="22.84" data-duration="1.82">Patience is most fitting.</div>
    <div id="c13-cp5" class="c13-cap clip" data-start="24.66" data-duration="3.53">And never despair of relief from Allah.</div>
    <div id="c13-k0w" class="c13-cardwrap clip" data-start="10.03" data-duration="8.14"><div id="c13-k0" class="c13-card"><div class="c13-ar" dir="rtl" lang="ar">لَقَدۡ كَانَ فِي قَصَصِهِمۡ عِبۡرَةࣱ لِّأُوْلِي ٱلۡأَلۡبَٰبِۗ</div><div class="c13-en">“There was certainly in their stories a lesson for those of understanding…”</div><div class="c13-ref">Yusuf 12:111</div></div></div>
