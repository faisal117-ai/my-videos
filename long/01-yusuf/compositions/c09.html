    <div id="c09-lab" class="c09-label clip" data-start="0.3" data-duration="4.6"><b>CHAPTER 9</b><i>The Brothers and the Golden Cup</i></div>
    <div id="c09-cp0" class="c09-cap clip" data-start="0.22" data-duration="3.80">One day, a group of travellers came to buy grain.</div>
    <div id="c09-cp1" class="c09-cap clip" data-start="4.02" data-duration="5.21">Yusuf looked at them... and knew them instantly. His brothers.</div>
    <div id="c09-cp2" class="c09-cap clip" data-start="9.23" data-duration="4.61">They had no idea who he was. He gave them their supplies and said:</div>
    <div id="c09-cp3" class="c09-cap clip" data-start="13.84" data-duration="4.52">&quot;Bring me a brother of yours from your father. If you do not bring him,</div>
    <div id="c09-cp4" class="c09-cap clip" data-start="18.36" data-duration="3.07">there will be no measure for you from me.&quot;</div>
    <div id="c09-cp5" class="c09-cap clip" data-start="48.98" data-duration="6.44">As the caravan set off, a voice called out: &quot;O caravan, indeed you are thieves!&quot;</div>
    <div id="c09-cp6" class="c09-cap clip" data-start="63.97" data-duration="4.06">&quot;If he steals, a brother of his has stolen before.&quot;</div>
    <div id="c09-cp7" class="c09-cap clip" data-start="68.03" data-duration="3.59">They were lying about Yusuf, to Yusuf&#x27;s face.</div>
    <div id="c09-cp8" class="c09-cap clip" data-start="71.62" data-duration="4.52">He kept it within himself, and said nothing. They begged him:</div>
    <div id="c09-cp9" class="c09-cap clip" data-start="76.14" data-duration="4.09">our father is an old man. Take one of us instead.</div>
    <div id="c09-cp10" class="c09-cap clip" data-start="80.22" data-duration="1.24">He refused.</div>
    <div id="c09-cp11" class="c09-cap clip" data-start="81.47" data-duration="4.87">And they went home... to tell their father he had lost another son.</div>
    <div id="c09-k0w" class="c09-cardwrap clip" data-start="21.48" data-duration="11.29"><div id="c09-k0" class="c09-card"><div class="c09-ar" dir="rtl" lang="ar">فَٱللَّهُ خَيۡرٌ حَٰفِظࣰاۖ وَهُوَ أَرۡحَمُ ٱلرَّـٰحِمِينَ</div><div class="c09-en">“…But Allah is the best guardian, and He is the most merciful of the merciful”</div><div class="c09-ref">Yusuf 12:64</div></div></div>
    <div id="c09-k1w" class="c09-cardwrap clip" data-start="35.18" data-duration="10.14"><div id="c09-k1" class="c09-card"><div class="c09-ar" dir="rtl" lang="ar">إِنِّيٓ أَنَا۠ أَخُوكَ فَلَا تَبۡتَئِسۡ بِمَا كَانُواْ يَعۡمَلُونَ</div><div class="c09-en">“…Indeed, I am your brother, so do not despair over what they used to do…”</div><div class="c09-ref">Yusuf 12:69</div></div></div>
