    <div id="c05-lab" class="c05-label clip" data-start="0.3" data-duration="4.6"><b>CHAPTER 5</b><i>The Women of the City</i></div>
    <div id="c05-cp0" class="c05-cap clip" data-start="0.22" data-duration="2.45">But the story spread.</div>
    <div id="c05-cp1" class="c05-cap clip" data-start="2.67" data-duration="6.33">The women of the city said: the wife of al-Aziz is chasing her servant.</div>
    <div id="c05-cp2" class="c05-cap clip" data-start="9.00" data-duration="2.53">She is clearly in error.</div>
    <div id="c05-cp3" class="c05-cap clip" data-start="11.53" data-duration="5.91">When she heard their talk, she invited them to a banquet, and gave each of them a knife.</div>
    <div id="c05-cp4" class="c05-cap clip" data-start="17.44" data-duration="4.23">Then she told Yusuf to come out before them. When they saw him,</div>
    <div id="c05-cp5" class="c05-cap clip" data-start="21.66" data-duration="3.21">they were so stunned that they cut their own hands.</div>
    <div id="c05-cp6" class="c05-cap clip" data-start="31.98" data-duration="4.19">&quot;That is the one you blamed me for.&quot; And if he would not obey her,</div>
    <div id="c05-cp7" class="c05-cap clip" data-start="36.18" data-duration="1.86">he would be imprisoned.</div>
    <div id="c05-cp8" class="c05-cap clip" data-start="38.03" data-duration="2.76">Now the pressure came from every side.</div>
    <div id="c05-cp9" class="c05-cap clip" data-start="40.80" data-duration="3.18">And Yusuf turned to the only One who could help.</div>
    <div id="c05-cp10" class="c05-cap clip" data-start="53.82" data-duration="3.30">And even after they had seen every sign of his innocence...</div>
