    <div id="c02-lab" class="c02-label clip" data-start="0.3" data-duration="4.6"><b>CHAPTER 2</b><i>The Well</i></div>
    <div id="c02-cp0" class="c02-cap clip" data-start="0.22" data-duration="2.00">His brothers were jealous.</div>
    <div id="c02-cp1" class="c02-cap clip" data-start="2.22" data-duration="2.61">&quot;Yusuf and his brother are more beloved</div>
    <div id="c02-cp2" class="c02-cap clip" data-start="4.83" data-duration="2.86">to our father than we are,&quot; they said.</div>
    <div id="c02-cp3" class="c02-cap clip" data-start="19.16" data-duration="2.17">to eat well and play.</div>
    <div id="c02-cp4" class="c02-cap clip" data-start="34.63" data-duration="4.03">They took him out, and together they put him into the bottom of the well.</div>
    <div id="c02-cp5" class="c02-cap clip" data-start="38.66" data-duration="4.92">And there, in the dark, alone, Allah sent him a promise.</div>
    <div id="c02-cp6" class="c02-cap clip" data-start="54.96" data-duration="3.03">&quot;O our father, we went racing each other,</div>
    <div id="c02-cp7" class="c02-cap clip" data-start="57.99" data-duration="3.86">and left Yusuf with our things... and a wolf ate him.&quot;</div>
    <div id="c02-cp8" class="c02-cap clip" data-start="78.14" data-duration="1.42">Remember those words...</div>
    <div id="c02-cp9" class="c02-cap clip" data-start="79.55" data-duration="2.70">because he will say them again.</div>
    <div id="c02-k0w" class="c02-cardwrap clip" data-start="7.74" data-duration="7.92"><div id="c02-k0" class="c02-card"><div class="c02-ar" dir="rtl" lang="ar">لَا تَقۡتُلُواْ يُوسُفَ وَأَلۡقُوهُ فِي غَيَٰبَتِ ٱلۡجُبِّ</div><div class="c02-en">“…Do not kill Joseph [Yusuf] but throw him into the bottom of the well…”</div><div class="c02-ref">Yusuf 12:10</div></div></div>
    <div id="c02-k1w" class="c02-cardwrap clip" data-start="21.37" data-duration="10.28"><div id="c02-k1" class="c02-card"><div class="c02-ar" dir="rtl" lang="ar">وَأَخَافُ أَن يَأۡكُلَهُ ٱلذِّئۡبُ وَأَنتُمۡ عَنۡهُ غَٰفِلُونَ</div><div class="c02-en">“…I fear that a wolf would eat him while you are of him unaware”</div><div class="c02-ref">Yusuf 12:13</div></div></div>
    <div id="c02-k2w" class="c02-cardwrap clip" data-start="43.63" data-duration="7.97"><div id="c02-k2" class="c02-card"><div class="c02-ar" dir="rtl" lang="ar">وَأَوۡحَيۡنَآ إِلَيۡهِ لَتُنَبِّئَنَّهُم بِأَمۡرِهِمۡ هَٰذَا وَهُمۡ لَا يَشۡعُرُونَ</div><div class="c02-en">“…You will surely inform them [someday] about this affair of theirs while they do not perceive…”</div><div class="c02-ref">Yusuf 12:15</div></div></div>
    <div id="c02-k3w" class="c02-cardwrap clip" data-start="61.90" data-duration="3.12"><div id="c02-k3" class="c02-card"><div class="c02-ar" dir="rtl" lang="ar">وَجَآءُو عَلَىٰ قَمِيصِهِۦ بِدَمࣲ كَذِبࣲۚ</div><div class="c02-en">“And they brought upon his shirt false blood…”</div><div class="c02-ref">Yusuf 12:18</div></div></div>
    <div id="c02-k4w" class="c02-cardwrap clip" data-start="65.12" data-duration="9.81"><div id="c02-k4" class="c02-card"><div class="c02-ar" dir="rtl" lang="ar">فَصَبۡرࣱ جَمِيلࣱۖ وَٱللَّهُ ٱلۡمُسۡتَعَانُ</div><div class="c02-en">“…so patience is most fitting. And Allah is the one sought for help…”</div><div class="c02-ref">Yusuf 12:18</div></div></div>
