    <div id="c11-lab" class="c11-label clip" data-start="0.3" data-duration="4.6"><b>CHAPTER 11</b><i>“I Am Yusuf”</i></div>
    <div id="c11-cp0" class="c11-cap clip" data-start="0.22" data-duration="5.31">So the brothers returned to Egypt, and stood once more before its ruler.</div>
    <div id="c11-cp1" class="c11-cap clip" data-start="5.53" data-duration="4.52">&quot;O Aziz, hardship has touched us and our family.</div>
    <div id="c11-cp2" class="c11-cap clip" data-start="10.04" data-duration="3.69">Give us full measure, and be charitable to us.&quot;</div>
    <div id="c11-cp3" class="c11-cap clip" data-start="13.73" data-duration="3.38">And the man in front of them asked one question.</div>
    <div id="c11-cp4" class="c11-cap clip" data-start="24.10" data-duration="2.78">&quot;Are you... are you indeed Yusuf?&quot;</div>
    <div id="c11-cp5" class="c11-cap clip" data-start="42.90" data-duration="5.68">They said: &quot;By Allah, Allah has preferred you over us, and we have been sinners.&quot;</div>
    <div id="c11-cp6" class="c11-cap clip" data-start="48.57" data-duration="4.92">He had the power to punish them. He had every reason to. Instead, he said:</div>
    <div id="c11-k0w" class="c11-cardwrap clip" data-start="17.16" data-duration="5.91"><div id="c11-k0" class="c11-card"><div class="c11-ar" dir="rtl" lang="ar">هَلۡ عَلِمۡتُم مَّا فَعَلۡتُم بِيُوسُفَ وَأَخِيهِ إِذۡ أَنتُمۡ جَٰهِلُونَ</div><div class="c11-en">“…Do you know what you did with Joseph [Yusuf] and his brother when you were ignorant”</div><div class="c11-ref">Yusuf 12:89</div></div></div>
    <div id="c11-k1w" class="c11-cardwrap clip" data-start="26.93" data-duration="13.57"><div id="c11-k1" class="c11-card"><div class="c11-ar" dir="rtl" lang="ar">قَالَ أَنَا۠ يُوسُفُ وَهَٰذَآ أَخِيۖ</div><div class="c11-en">“…I am Joseph [Yusuf], and this is my brother…”</div><div class="c11-ref">Yusuf 12:90</div></div></div>
    <div id="c11-k2w" class="c11-cardwrap clip" data-start="53.54" data-duration="7.77"><div id="c11-k2" class="c11-card"><div class="c11-ar" dir="rtl" lang="ar">لَا تَثۡرِيبَ عَلَيۡكُمُ ٱلۡيَوۡمَۖ يَغۡفِرُ ٱللَّهُ لَكُمۡۖ وَهُوَ أَرۡحَمُ ٱلرَّـٰحِمِينَ</div><div class="c11-en">“…No blame will there be upon you today. Allah will forgive you; and He is the most merciful of the merciful”</div><div class="c11-ref">Yusuf 12:92</div></div></div>
