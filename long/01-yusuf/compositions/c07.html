    <div id="c07-scr" class="c07-scrim clip" data-start="0" data-duration="61.95"></div>
    <div id="c07-lab" class="c07-label clip" data-start="0.3" data-duration="4.6"><b>CHAPTER 7</b><i>The King&#x27;s Dream</i></div>
    <div id="c07-cp0" class="c07-cap clip" data-start="0.22" data-duration="3.74">Then one night, the king of Egypt saw a dream that shook him.</div>
    <div id="c07-cp1" class="c07-cap clip" data-start="18.89" data-duration="3.30">&quot;A mixture of false dreams,&quot; they said.</div>
    <div id="c07-cp2" class="c07-cap clip" data-start="22.19" data-duration="3.26">And suddenly, the man who had been freed remembered.</div>
    <div id="c07-cp3" class="c07-cap clip" data-start="25.45" data-duration="3.12">After all those years... he remembered Yusuf.</div>
    <div id="c07-cp4" class="c07-cap clip" data-start="28.57" data-duration="6.50">He went to the prison. &quot;Yusuf, O man of truth, explain this to us.&quot;</div>
    <div id="c07-cp5" class="c07-cap clip" data-start="35.07" data-duration="5.88">Yusuf did not bargain for his freedom. He simply gave them the answer, and a plan.</div>
    <div id="c07-cp6" class="c07-cap clip" data-start="40.95" data-duration="3.12">For seven years, plant as usual.</div>
    <div id="c07-cp7" class="c07-cap clip" data-start="44.07" data-duration="4.90">What you harvest, leave in its ears, except a little that you eat.</div>
    <div id="c07-cp8" class="c07-cap clip" data-start="48.97" data-duration="4.35">Then seven hard years will come, and eat up what you stored.</div>
    <div id="c07-k0w" class="c07-cardwrap clip" data-start="4.00" data-duration="13.41"><div id="c07-k0" class="c07-card"><div class="c07-ar" dir="rtl" lang="ar">إِنِّيٓ أَرَىٰ سَبۡعَ بَقَرَٰتࣲ سِمَانࣲ يَأۡكُلُهُنَّ سَبۡعٌ عِجَافࣱ وَسَبۡعَ سُنۢبُلَٰتٍ خُضۡرࣲ وَأُخَرَ يَابِسَٰتࣲۖ</div><div class="c07-en">“…Indeed, I have seen [in a dream] seven fat cows being eaten by seven [that were] lean, and seven green spikes [of grain] and others [that were] dry…”</div><div class="c07-ref">Yusuf 12:43</div></div></div>
    <div id="c07-k1w" class="c07-cardwrap clip" data-start="53.37" data-duration="5.50"><div id="c07-k1" class="c07-card"><div class="c07-ctext">7 years of plenty · 7 years of hardship · then rain</div><div class="c07-ref">Yusuf 12:47–49</div></div></div>
