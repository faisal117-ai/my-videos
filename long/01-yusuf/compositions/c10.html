    <div id="c10-cp0" class="c10-cap clip" data-start="0.22" data-duration="6.38">When they told him, Hazrat Yaqub said the same words he had said all those years ago.</div>
    <div id="c10-cp1" class="c10-cap clip" data-start="6.60" data-duration="3.41">&quot;Rather, your souls have enticed you to something.</div>

    <div id="c10-cp3" class="c10-cap clip" data-start="12.26" data-duration="2.75">Sabrun jameel. Again.</div>
    <div id="c10-cp4" class="c10-cap clip" data-start="22.15" data-duration="3.66">&quot;Oh, my sorrow over Yusuf.&quot; His grief</div>
    <div id="c10-cp5" class="c10-cap clip" data-start="25.81" data-duration="3.04">was so deep that his eyes turned white.</div>
    <div id="c10-cp6" class="c10-cap clip" data-start="28.85" data-duration="6.50">And still, he held it in. His sons told him to stop, before grief destroyed him.</div>
    <div id="c10-cp7" class="c10-cap clip" data-start="35.35" data-duration="4.43">And he answered with one of the most beautiful lines in the Quran.</div>
    <div id="c10-cp8" class="c10-cap clip" data-start="59.01" data-duration="2.20">he still had not given up.</div>
