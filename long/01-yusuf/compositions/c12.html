    <div id="c12-lab" class="c12-label clip" data-start="0.3" data-duration="4.6"><b>CHAPTER 12</b><i>The Third Shirt</i></div>
    <div id="c12-cp0" class="c12-cap clip" data-start="11.51" data-duration="2.12">The first carried a lie.</div>
    <div id="c12-cp1" class="c12-cap clip" data-start="13.63" data-duration="2.23">The second carried the truth.</div>
    <div id="c12-cp2" class="c12-cap clip" data-start="15.86" data-duration="2.24">This one would carry healing.</div>
    <div id="c12-cp3" class="c12-cap clip" data-start="18.10" data-duration="4.75">As the caravan left Egypt, far away, an old man said:</div>
    <div id="c12-cp4" class="c12-cap clip" data-start="22.85" data-duration="2.10">&quot;I can smell Yusuf...</div>
    <div id="c12-cp5" class="c12-cap clip" data-start="24.95" data-duration="4.81">if you would not think me weak in mind.&quot; When the bearer of good news arrived,</div>
    <div id="c12-cp6" class="c12-cap clip" data-start="29.76" data-duration="3.74">he cast the shirt over his face... and he could see again.</div>
    <div id="c12-cp7" class="c12-cap clip" data-start="40.98" data-duration="2.90">Yusuf raised his parents up onto the throne...</div>
    <div id="c12-cp8" class="c12-cap clip" data-start="43.88" data-duration="4.53">and they all bowed down before him. The sun. The moon.</div>
    <div id="c12-cp9" class="c12-cap clip" data-start="48.41" data-duration="1.87">And eleven stars.</div>
    <div id="c12-cp10" class="c12-cap clip" data-start="58.83" data-duration="5.32">&quot;He was good to me when He took me out of prison.&quot; Notice what he did not say.</div>
    <div id="c12-cp11" class="c12-cap clip" data-start="64.14" data-duration="4.09">He did not say &quot;when He took me out of the well.&quot; Even now,</div>
    <div id="c12-cp12" class="c12-cap clip" data-start="68.23" data-duration="2.45">he would not shame his brothers.</div>
    <div id="c12-k0w" class="c12-cardwrap clip" data-start="0.15" data-duration="10.88"><div id="c12-k0" class="c12-card"><div class="c12-ar" dir="rtl" lang="ar">ٱذۡهَبُواْ بِقَمِيصِي هَٰذَا فَأَلۡقُوهُ عَلَىٰ وَجۡهِ أَبِي يَأۡتِ بَصِيرࣰا</div><div class="c12-en">“Take this, my shirt, and cast it over the face of my father; he will become seeing…”</div><div class="c12-ref">Yusuf 12:93</div></div></div>
    <div id="c12-k1w" class="c12-cardwrap clip" data-start="33.54" data-duration="5.51"><div id="c12-k1" class="c12-card"><div class="c12-ar" dir="rtl" lang="ar">قَالَ أَلَمۡ أَقُل لَّكُمۡ إِنِّيٓ أَعۡلَمُ مِنَ ٱللَّهِ مَا لَا تَعۡلَمُونَ</div><div class="c12-en">“…Did I not tell you that I know from Allah that which you do not know”</div><div class="c12-ref">Yusuf 12:96</div></div></div>
    <div id="c12-k2w" class="c12-cardwrap clip" data-start="50.33" data-duration="8.37"><div id="c12-k2" class="c12-card"><div class="c12-ar" dir="rtl" lang="ar">يَـٰٓأَبَتِ هَٰذَا تَأۡوِيلُ رُءۡيَٰيَ مِن قَبۡلُ قَدۡ جَعَلَهَا رَبِّي حَقࣰّاۖ</div><div class="c12-en">“…O my father, this is the explanation of my vision of before. My Lord has made it reality…”</div><div class="c12-ref">Yusuf 12:100</div></div></div>
