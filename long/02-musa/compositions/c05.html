    <div id="c05-cp0" class="c05-cap clip" data-start="0.22" data-duration="4.81">When his term was complete, Musa set out with his family, back toward Egypt.</div>
    <div id="c05-cp1" class="c05-cap clip" data-start="14.99" data-duration="4.86">Perhaps I can bring you some news, or a burning stick, so you can warm yourselves.</div>
    <div id="c05-cp2" class="c05-cap clip" data-start="39.80" data-duration="4.24">&quot;And what is that in your right hand, O Musa?&quot; He said:</div>

    <div id="c05-cp4" class="c05-cap clip" data-start="45.92" data-duration="3.49">I lean on it, and I bring down leaves for my sheep.</div>
    <div id="c05-cp5" class="c05-cap clip" data-start="58.57" data-duration="2.76">We will return it to its former state.&quot;</div>
    <div id="c05-k0w" class="c05-cardwrap clip" data-start="5.08" data-duration="7.90"><div id="c05-k0" class="c05-card"><div class="c05-ar" dir="rtl" lang="ar">ءَانَسَ مِن جَانِبِ ٱلطُّورِ نَارࣰاۖ</div><div class="c05-en">“…he perceived from the direction of the mount a fire…”</div><div class="c05-ref">Al-Qasas 28:29</div></div></div>
    <div id="c05-k1w" class="c05-cardwrap clip" data-start="19.90" data-duration="10.13"><div id="c05-k1" class="c05-card"><div class="c05-ar" dir="rtl" lang="ar">إِنِّيٓ أَنَا۠ رَبُّكَ فَٱخۡلَعۡ نَعۡلَيۡكَ إِنَّكَ بِٱلۡوَادِ ٱلۡمُقَدَّسِ طُوࣰى</div><div class="c05-en">“Indeed, I am your Lord, so remove your sandals. Indeed, you are in the sacred valley of Tuwa”</div><div class="c05-ref">Taha 20:12</div></div></div>
