    <div id="c04-lab" class="c04-label clip" data-start="0.3" data-duration="4.6"><b>CHAPTER 4</b><i>The Well of Madyan</i></div>
    <div id="c04-cp0" class="c04-cap clip" data-start="0.22" data-duration="2.08">He walked across the desert for days,</div>
    <div id="c04-cp1" class="c04-cap clip" data-start="2.30" data-duration="5.10">with no food and no shelter, until he reached the land of Madyan.</div>
    <div id="c04-cp2" class="c04-cap clip" data-start="7.39" data-duration="3.15">At the well, shepherds crowded around the water.</div>
    <div id="c04-cp3" class="c04-cap clip" data-start="10.54" data-duration="4.59">And standing apart, he saw two women holding back their flock.</div>
    <div id="c04-cp4" class="c04-cap clip" data-start="15.13" data-duration="3.21">He asked them what was wrong. They said:</div>
    <div id="c04-cp5" class="c04-cap clip" data-start="18.33" data-duration="3.51">we cannot water our sheep until the shepherds leave.</div>
    <div id="c04-cp6" class="c04-cap clip" data-start="21.84" data-duration="5.89">And our father is a very old man. So Musa watered their flock for them.</div>
    <div id="c04-cp7" class="c04-cap clip" data-start="27.72" data-duration="4.75">Then he went back to the shade of a tree. Exhausted. Hungry.</div>
    <div id="c04-cp8" class="c04-cap clip" data-start="32.47" data-duration="1.80">A stranger with nothing.</div>
    <div id="c04-cp9" class="c04-cap clip" data-start="56.94" data-duration="3.76">And Musa stayed in Madyan for years.</div>
    <div id="c04-k0w" class="c04-cardwrap clip" data-start="34.32" data-duration="7.30"><div id="c04-k0" class="c04-card"><div class="c04-ar" dir="rtl" lang="ar">رَبِّ إِنِّي لِمَآ أَنزَلۡتَ إِلَيَّ مِنۡ خَيۡرࣲ فَقِيرࣱ</div><div class="c04-en">“…My Lord, indeed I am, for whatever good You would send down to me, in need”</div><div class="c04-ref">Al-Qasas 28:24</div></div></div>
