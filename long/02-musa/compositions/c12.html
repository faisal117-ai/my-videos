    <div id="c12-lab" class="c12-label clip" data-start="0.3" data-duration="4.6"><b>CHAPTER 12</b><i>The Lesson</i></div>
    <div id="c12-cp0" class="c12-cap clip" data-start="0.22" data-duration="4.17">A baby in a basket. A stranger alone at a well.</div>
    <div id="c12-cp1" class="c12-cap clip" data-start="4.39" data-duration="3.65">A shepherd with a staff, standing before a king.</div>
    <div id="c12-cp2" class="c12-cap clip" data-start="8.03" data-duration="2.98">Every time, it looked like Musa had nothing.</div>
    <div id="c12-cp3" class="c12-cap clip" data-start="11.02" data-duration="5.65">And every time, Allah was with him. When he was afraid, Allah said: fear not.</div>
    <div id="c12-cp4" class="c12-cap clip" data-start="16.67" data-duration="4.08">When he was alone, he said: my Lord, I am in need.</div>
    <div id="c12-cp5" class="c12-cap clip" data-start="20.75" data-duration="2.39">And when the sea was in front of him, he said:</div>
    <div id="c12-cp6" class="c12-cap clip" data-start="32.11" data-duration="2.13">your Lord is with you too.</div>
    <div id="c12-k0w" class="c12-cardwrap clip" data-start="23.18" data-duration="5.98"><div id="c12-k0" class="c12-card"><div class="c12-ar" dir="rtl" lang="ar">قَالَ كَلَّآۖ إِنَّ مَعِيَ رَبِّي سَيَهۡدِينِ</div><div class="c12-en">“…No! Indeed, with me is my Lord; He will guide me”</div><div class="c12-ref">Ash-Shu&#x27;ara 26:62</div></div></div>
