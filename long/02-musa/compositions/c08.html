    <div id="c08-lab" class="c08-label clip" data-start="0.3" data-duration="4.6"><b>CHAPTER 8</b><i>The Magicians</i></div>
    <div id="c08-cp0" class="c08-cap clip" data-start="0.22" data-duration="4.17">On the day of the festival, the whole city came to watch.</div>
    <div id="c08-cp1" class="c08-cap clip" data-start="4.39" data-duration="3.08">Pharaoh brought the best magicians in Egypt.</div>
    <div id="c08-cp2" class="c08-cap clip" data-start="7.46" data-duration="1.24">Musa said:</div>
    <div id="c08-cp3" class="c08-cap clip" data-start="8.71" data-duration="1.49">you throw first.</div>
    <div id="c08-cp4" class="c08-cap clip" data-start="10.19" data-duration="2.85">And they threw down their ropes and their staffs.</div>
    <div id="c08-cp5" class="c08-cap clip" data-start="36.25" data-duration="2.64">And they knew: this was not magic.</div>
    <div id="c08-cp6" class="c08-cap clip" data-start="49.17" data-duration="5.50">He threatened to cut off their hands and feet, and crucify them on the trunks of palm trees.</div>
    <div id="c08-cp7" class="c08-cap clip" data-start="70.59" data-duration="2.37">They left as believers.</div>
