    <div id="c11-cp0" class="c11-cap clip" data-start="0.22" data-duration="3.04">فرعون نے راستہ دیکھا، اور اپنے سارے سپاہیوں</div>
    <div id="c11-cp1" class="c11-cap clip" data-start="3.26" data-duration="2.52">کے ساتھ ان کے پیچھے سمندر میں اتر گیا۔</div>
    <div id="c11-cp2" class="c11-cap clip" data-start="16.62" data-duration="2.60">جو خود کو خدا کہتا تھا، بول اٹھا:</div>
    <div id="c11-cp3" class="c11-cap clip" data-start="49.86" data-duration="5.08">اسی پانی میں ڈوب گیا، جس نے کبھی ننھے موسیٰ کو حفاظت سے پہنچایا تھا۔</div>
    <div id="c11-k0w" class="c11-cardwrap clip" data-start="5.83" data-duration="9.59"><div id="c11-k0" class="c11-card"><div class="c11-ar" dir="rtl" lang="ar">وَأَنجَيۡنَا مُوسَىٰ وَمَن مَّعَهُۥٓ أَجۡمَعِينَ</div><div class="c11-en c11-urtr" dir="rtl" lang="ur">موسیٰؑ اور اُن سب لوگوں کو جو اس کے ساتھ تھے، ہم نے بچا لیا</div><div class="c11-ref">Ash-Shu&#x27;ara 26:65</div></div></div>
    <div id="c11-k1w" class="c11-cardwrap clip" data-start="19.27" data-duration="10.58"><div id="c11-k1" class="c11-card"><div class="c11-ar" dir="rtl" lang="ar">ءَامَنتُ أَنَّهُۥ لَآ إِلَٰهَ إِلَّا ٱلَّذِيٓ ءَامَنَتۡ بِهِۦ بَنُوٓاْ إِسۡرَـٰٓءِيلَ وَأَنَا۠ مِنَ ٱلۡمُسۡلِمِينَ</div><div class="c11-en c11-urtr" dir="rtl" lang="ur">میں نے مان لیا کہ خداوند حقیقی اُس کے سوا کوئی نہیں ہے جس پر بنی اسرائیل ایمان لائے، اور میں بھی سر اطاعت جھکا دینے والوں میں سے ہوں</div><div class="c11-ref">Yunus 10:90</div></div></div>
    <div id="c11-k2w" class="c11-cardwrap clip" data-start="29.95" data-duration="9.41"><div id="c11-k2" class="c11-card"><div class="c11-ar" dir="rtl" lang="ar">ءَآلۡـَٰٔنَ وَقَدۡ عَصَيۡتَ قَبۡلُ وَكُنتَ مِنَ ٱلۡمُفۡسِدِينَ</div><div class="c11-en c11-urtr" dir="rtl" lang="ur">اب ایمان لاتا ہے! حالانکہ اِس سے پہلے تک تو نافرمانی کرتا رہا اور فساد برپا کرنے والوں میں سے تھا</div><div class="c11-ref">Yunus 10:91</div></div></div>
    <div id="c11-k3w" class="c11-cardwrap clip" data-start="39.46" data-duration="7.28"><div id="c11-k3" class="c11-card"><div class="c11-ar" dir="rtl" lang="ar">فَٱلۡيَوۡمَ نُنَجِّيكَ بِبَدَنِكَ لِتَكُونَ لِمَنۡ خَلۡفَكَ ءَايَةࣰۚ</div><div class="c11-en c11-urtr" dir="rtl" lang="ur">اب تو ہم صرف تیری لاش ہی کو بچائیں گے تاکہ تو بعد کی نسلوں کے لیے نشان عبرت بنے</div><div class="c11-ref">Yunus 10:92</div></div></div>
