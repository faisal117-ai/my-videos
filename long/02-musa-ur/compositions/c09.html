    <div id="c09-lab" class="c09-label clip" data-start="0.3" data-duration="4.6"><b>باب 9</b><i>نشانیاں</i></div>
    <div id="c09-cp0" class="c09-cap clip" data-start="0.22" data-duration="4.03">پھر بھی، فرعون اور اس کے سرداروں نے انکار کیا۔</div>
    <div id="c09-cp1" class="c09-cap clip" data-start="4.25" data-duration="4.09">تو اللہ نے ان پر ایک کے بعد ایک نشانی بھیجی۔</div>
    <div id="c09-cp2" class="c09-cap clip" data-start="21.87" data-duration="4.49">اپنے رب سے ہمارے لیے دعا کرو۔ اگر یہ ٹل گئی تو ہم ایمان لے</div>
    <div id="c09-cp3" class="c09-cap clip" data-start="26.36" data-duration="3.00">آئیں گے، اور بنی اسرائیل کو جانے دیں گے۔</div>
    <div id="c09-cp4" class="c09-cap clip" data-start="29.36" data-duration="4.28">اور ہر بار جب وہ ٹل جاتی، وہ اپنا وعدہ توڑ دیتے۔</div>
    <div id="c09-cp5" class="c09-cap clip" data-start="33.64" data-duration="4.60">مگر وہ سرکشی کیے چلے گئے، اور وہ بڑے ہی مجرم لوگ تھے۔</div>
    <div id="c09-k0w" class="c09-cardwrap clip" data-start="8.39" data-duration="10.59"><div id="c09-k0" class="c09-card"><div class="c09-ar" dir="rtl" lang="ar">فَأَرۡسَلۡنَا عَلَيۡهِمُ ٱلطُّوفَانَ وَٱلۡجَرَادَ وَٱلۡقُمَّلَ وَٱلضَّفَادِعَ وَٱلدَّمَ ءَايَٰتࣲ مُّفَصَّلَٰتࣲ</div><div class="c09-en c09-urtr" dir="rtl" lang="ur">آخر کار ہم نے ان پر طوفان بھیجا، ٹڈی دل چھوڑے، سرسریاں پھیلائیں، مینڈک نکالے، اور خو ن برسایا</div><div class="c09-ref">Al-A&#x27;raf 7:133</div></div></div>
    <div id="c09-k1w" class="c09-cardwrap clip" data-start="38.29" data-duration="8.75"><div id="c09-k1" class="c09-card"><div class="c09-ar" dir="rtl" lang="ar">أَسۡرِ بِعِبَادِيٓ إِنَّكُم مُّتَّبَعُونَ</div><div class="c09-en c09-urtr" dir="rtl" lang="ur">راتوں رات میرے بندوں کو لے کر نکل جاؤ، تمہارا پیچھا کیا جائے گا</div><div class="c09-ref">Ash-Shu&#x27;ara 26:52</div></div></div>
