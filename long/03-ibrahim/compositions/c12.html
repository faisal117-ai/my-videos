    <div id="c12-scr" class="c12-scrim clip" data-start="0" data-duration="65.29"></div>
    <div id="c12-lab" class="c12-label clip" data-start="0.3" data-duration="4.6"><b>CHAPTER 12</b><i>The House</i></div>
    <div id="c12-cp0" class="c12-cap clip" data-start="0.22" data-duration="3.69">Then Allah showed Ibrahim the place of His House.</div>
    <div id="c12-cp1" class="c12-cap clip" data-start="3.91" data-duration="2.73">And father and son began to build.</div>
    <div id="c12-cp2" class="c12-cap clip" data-start="6.64" data-duration="1.93">Ibrahim laid the stones.</div>
    <div id="c12-cp3" class="c12-cap clip" data-start="8.57" data-duration="2.00">Ismail carried them.</div>
    <div id="c12-cp4" class="c12-cap clip" data-start="10.56" data-duration="3.60">And as the walls of the Kaaba rose, they prayed:</div>
    <div id="c12-cp5" class="c12-cap clip" data-start="32.66" data-duration="3.77">our Lord, send among them a messenger from themselves,</div>
    <div id="c12-cp6" class="c12-cap clip" data-start="36.43" data-duration="2.81">who will recite Your verses to them.</div>
    <div id="c12-cp7" class="c12-cap clip" data-start="39.24" data-duration="3.75">Thousands of years later, that dua was answered:</div>
    <div id="c12-cp8" class="c12-cap clip" data-start="42.99" data-duration="4.12">Prophet Muhammad, sallallahu alayhi wa sallam.</div>
    <div id="c12-cp9" class="c12-cap clip" data-start="59.74" data-duration="4.95">Millions of people every year, answering the call of Ibrahim.</div>
    <div id="c12-k0w" class="c12-cardwrap clip" data-start="14.21" data-duration="6.22"><div id="c12-k0" class="c12-card"><div class="c12-ar" dir="rtl" lang="ar">رَبَّنَا تَقَبَّلۡ مِنَّآۖ إِنَّكَ أَنتَ ٱلسَّمِيعُ ٱلۡعَلِيمُ</div><div class="c12-en">“…Our Lord, accept [this] from us. Indeed You are the Hearing, the Knowing”</div><div class="c12-ref">Al-Baqarah 2:127</div></div></div>
    <div id="c12-k1w" class="c12-cardwrap clip" data-start="20.53" data-duration="10.25"><div id="c12-k1" class="c12-card"><div class="c12-ar" dir="rtl" lang="ar">رَبَّنَا وَٱجۡعَلۡنَا مُسۡلِمَيۡنِ لَكَ وَمِن ذُرِّيَّتِنَآ أُمَّةࣰ مُّسۡلِمَةࣰ لَّكَ</div><div class="c12-en">“Our Lord, and make us Muslims [in submission] to You and from our descendants a Muslim nation [in submission] to You…”</div><div class="c12-ref">Al-Baqarah 2:128</div></div></div>
    <div id="c12-k2w" class="c12-cardwrap clip" data-start="47.16" data-duration="11.67"><div id="c12-k2" class="c12-card"><div class="c12-ar" dir="rtl" lang="ar">وَأَذِّن فِي ٱلنَّاسِ بِٱلۡحَجِّ يَأۡتُوكَ رِجَالࣰا وَعَلَىٰ كُلِّ ضَامِرࣲ يَأۡتِينَ مِن كُلِّ فَجٍّ عَمِيقࣲ</div><div class="c12-en">“And proclaim to the people the Hajj [pilgrimage]; they will come to you on foot and on every lean camel; they will come from every distant pass”</div><div class="c12-ref">Al-Hajj 22:27</div></div></div>
