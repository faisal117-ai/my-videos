    <div id="c05-lab" class="c05-label clip" data-start="0.3" data-duration="4.6"><b>CHAPTER 5</b><i>The Fire</i></div>
    <div id="c05-cp0" class="c05-cap clip" data-start="0.22" data-duration="3.55">They had lost the argument. So they turned to force.</div>
    <div id="c05-cp1" class="c05-cap clip" data-start="9.90" data-duration="3.20">They built a fire so great that no one could come near it,</div>
    <div id="c05-cp2" class="c05-cap clip" data-start="13.11" data-duration="6.29">and they hurled him into it from far away. A young man, alone, falling into the flames.</div>
    <div id="c05-cp3" class="c05-cap clip" data-start="29.35" data-duration="2.09">obeyed its Creator.</div>
    <div id="c05-cp4" class="c05-cap clip" data-start="31.44" data-duration="2.67">It burned his ropes, and not him.</div>
    <div id="c05-k0w" class="c05-cardwrap clip" data-start="3.82" data-duration="5.50"><div id="c05-k0" class="c05-card"><div class="c05-ar" dir="rtl" lang="ar">حَرِّقُوهُ وَٱنصُرُوٓاْ ءَالِهَتَكُمۡ إِن كُنتُمۡ فَٰعِلِينَ</div><div class="c05-en">“…Burn him and support your gods - if you are to act”</div><div class="c05-ref">Al-Anbya 21:68</div></div></div>
    <div id="c05-k1w" class="c05-cardwrap clip" data-start="19.45" data-duration="8.64"><div id="c05-k1" class="c05-card"><div class="c05-ar" dir="rtl" lang="ar">يَٰنَارُ كُونِي بَرۡدࣰا وَسَلَٰمًا عَلَىٰٓ إِبۡرَٰهِيمَ</div><div class="c05-en">“…O fire, be coolness and safety upon Abraham”</div><div class="c05-ref">Al-Anbya 21:69</div></div></div>
    <div id="c05-k2w" class="c05-cardwrap clip" data-start="34.16" data-duration="5.60"><div id="c05-k2" class="c05-card"><div class="c05-ar" dir="rtl" lang="ar">وَأَرَادُواْ بِهِۦ كَيۡدࣰا فَجَعَلۡنَٰهُمُ ٱلۡأَخۡسَرِينَ</div><div class="c05-en">“And they intended for him harm, but We made them the greatest losers”</div><div class="c05-ref">Al-Anbya 21:70</div></div></div>
