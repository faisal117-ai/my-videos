    <div id="c09-cp0" class="c09-cap clip" data-start="0.22" data-duration="3.50">Ibrahim had seen the fire turn cool.</div>
    <div id="c09-cp1" class="c09-cap clip" data-start="3.71" data-duration="6.31">He had seen water rise from a desert. And still, he asked his Lord for one more thing.</div>

    <div id="c09-cp3" class="c09-cap clip" data-start="29.27" data-duration="5.25">He called... and they came flying back to him, alive, in haste.</div>
    <div id="c09-cp4" class="c09-cap clip" data-start="34.52" data-duration="6.03">Faith does not mean you never ask. It means you ask the One who has the answer.</div>
